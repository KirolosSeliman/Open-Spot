name: Supabase Migrations

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"

  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"

  workflow_dispatch:
    inputs:
      apply:
        description: "Apply migrations to production Supabase"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "dry-run-only"

permissions:
  contents: read

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  dry-run:
    name: Dry run Supabase migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "SUPABASE_PROJECT_REF is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_DB_PASSWORD is missing."
            exit 1
          fi

      - name: Link Supabase project
        shell: bash
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show migration status before dry run
        shell: bash
        run: |
          supabase migration list

      - name: Dry run remote migration push
        shell: bash
        run: |
          supabase db push --dry-run

  apply:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    needs:
      - dry-run
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "SUPABASE_PROJECT_REF is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_DB_PASSWORD is missing."
            exit 1
          fi

      - name: Link Supabase project
        shell: bash
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show migration status before apply
        shell: bash
        run: |
          supabase migration list

      - name: Apply remote migrations
        shell: bash
        run: |
          supabase db push

      - name: Show migration status after apply
        shell: bash
        run: |
          supabase migration list
